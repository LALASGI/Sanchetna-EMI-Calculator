plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abviva.loancalculator'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.abviva.loancalculator'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '1.4'
    }

    signingConfigs {
        release {
            def keystoreFile = rootProject.file("abviva-release-key.jks")
            storeFile keystoreFile
            storePassword System.getenv("ABVIVA_KEYSTORE_PASSWORD")
            keyAlias System.getenv("ABVIVA_KEY_ALIAS")
            keyPassword System.getenv("ABVIVA_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
