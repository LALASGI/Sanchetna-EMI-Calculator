name: Build ABVIVA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
          arguments: -p ABVIVA_Android_Studio_Project_Exact_Logo assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ABVIVA-Loan-Calculator-APK
          path: ABVIVA_Android_Studio_Project_Exact_Logo/app/build/outputs/apk/debug/app-debug.apk
