name: Build Signed ABVIVA Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v1.2
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found in the preinstalled Android SDK."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Decode release signing key
        env:
          ABVIVA_KEYSTORE_BASE64: ${{ secrets.ABVIVA_KEYSTORE_BASE64 }}
        run: |
          echo "$ABVIVA_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/ABVIVA_Android_Studio_Project_Exact_Logo/abviva-release-key.jks"
          test -s "$GITHUB_WORKSPACE/ABVIVA_Android_Studio_Project_Exact_Logo/abviva-release-key.jks"

      - name: Build signed release APK
        uses: gradle/gradle-build-action@v3
        env:
          ABVIVA_KEYSTORE_PASSWORD: ${{ secrets.ABVIVA_KEYSTORE_PASSWORD }}
          ABVIVA_KEY_ALIAS: ${{ secrets.ABVIVA_KEY_ALIAS }}
          ABVIVA_KEY_PASSWORD: ${{ secrets.ABVIVA_KEY_PASSWORD }}
        with:
          gradle-version: '8.7'
          arguments: -p ABVIVA_Android_Studio_Project_Exact_Logo assembleRelease

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ABVIVA Loan Calculator 1.2
          make_latest: true
          generate_release_notes: true
          files: ABVIVA_Android_Studio_Project_Exact_Logo/app/build/outputs/apk/release/app-release.apk
